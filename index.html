<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>JARVIS ULTIMATE</title>
  <style>
    :root{color-scheme:dark;--bg:#05080d;--panel:#0b111a;--line:#172635;--blue:#43caff;--text:#eaf7ff;--muted:#8298aa}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#0b1b2b 0%,var(--bg) 55%);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}
    button,input,textarea{font:inherit}button{cursor:pointer}
    .app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
    header{display:flex;align-items:center;justify-content:space-between;padding:20px 4px}
    .brand{letter-spacing:.22em;font-weight:700;color:#dff7ff}.status{font-size:12px;color:var(--muted)}
    .tabs{display:flex;gap:8px;background:#08111a;border:1px solid var(--line);border-radius:14px;padding:5px}
    .tab{flex:1;border:0;border-radius:10px;padding:12px;background:transparent;color:var(--muted)}
    .tab.active{background:#102536;color:var(--blue);box-shadow:inset 0 0 0 1px #1d4058}
    .view{display:none;flex:1;min-height:0}.view.active{display:flex;flex-direction:column}
    .home{align-items:center;justify-content:center;text-align:center;gap:18px;padding:35px 0}
    .orb-wrap{width:min(65vw,270px);aspect-ratio:1;display:grid;place-items:center;position:relative}
    .orb{width:70%;height:70%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#baf7ff 0,#42caff 10%,#0876b8 34%,#06172c 69%,#02060c 100%);box-shadow:0 0 24px #13baff66,0 0 80px #008cff30,inset -15px -20px 35px #02050c;animation:pulse 4s ease-in-out infinite}
    .orb:before{content:"";position:absolute;inset:7%;border-radius:50%;border:1px solid #47cfff33;box-shadow:0 0 30px #22bfff1c}
    @keyframes pulse{0%,100%{transform:scale(.98);filter:brightness(.9)}50%{transform:scale(1.03);filter:brightness(1.2)}}
    h1{font-size:28px;letter-spacing:.28em;margin:0 0 8px} .subtitle{color:var(--muted);margin:0;line-height:1.5}
    .primary{border:1px solid #24516c;background:#0d2435;color:#bfeeff;border-radius:14px;padding:13px 22px}
    .chat{padding:14px 0;gap:12px;min-height:0}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:8px 2px 16px}
    .msg{max-width:88%;padding:13px 15px;border-radius:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
    .msg.user{align-self:flex-end;background:#102b40;border:1px solid #1c4966}
    .msg.jarvis{align-self:flex-start;background:#0b121b;border:1px solid #182b3b}
    .msg.system{align-self:center;background:transparent;color:var(--muted);font-size:13px;text-align:center}
    .composer{display:flex;gap:8px;align-items:flex-end;background:#09121b;border:1px solid #1a2c3c;border-radius:16px;padding:8px}
    textarea{flex:1;resize:none;max-height:140px;min-height:42px;background:transparent;color:var(--text);border:0;outline:0;padding:10px}
    .send{height:42px;width:44px;border:0;border-radius:12px;background:#0f6e9d;color:white;font-size:20px}
    .send:disabled{opacity:.45}.hint{font-size:12px;color:var(--muted);text-align:center}
    footer{padding:14px 0 18px;text-align:center;color:#526779;font-size:11px}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand">JARVIS <span style="color:var(--blue)">ULTIMATE</span></div><div class="status" id="status">● Система готова</div></header>
  <nav class="tabs">
    <button class="tab active" data-view="home">Главный экран</button>
    <button class="tab" data-view="chat">Текстовый чат</button>
  </nav>
  <section class="view active home" id="home">
    <div class="orb-wrap"><div class="orb"></div></div>
    <div><h1>JARVIS</h1><p class="subtitle">Я вас слушаю.<br>Какое будет поручение?</p></div>
    <button class="primary" id="openChat">Открыть текстовый чат</button>
    <p class="hint">Голосовой режим будет подключён отдельным этапом.</p>
  </section>
  <section class="view chat" id="chat">
    <div class="messages" id="messages">
      <div class="msg jarvis">Здравствуйте. Я JARVIS ULTIMATE. Напишите, чем могу помочь.</div>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Напишите сообщение JARVIS…"></textarea>
      <button class="send" id="send" aria-label="Отправить">↑</button>
    </div>
    <div class="hint">Enter — отправить · Shift+Enter — новая строка</div>
  </section>
  <footer>JARVIS ULTIMATE · Prototype v0.1</footer>
</div>
<script>
  // Адрес backend. После развёртывания сервера замените URL на свой.
  const API_URL = "https://YOUR-BACKEND-DOMAIN/api/chat";
  const tabs = document.querySelectorAll(".tab");
  const views = document.querySelectorAll(".view");
  const messages = document.getElementById("messages");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const history = [];

  function switchView(name){
    tabs.forEach(t=>t.classList.toggle("active",t.dataset.view===name));
    views.forEach(v=>v.classList.toggle("active",v.id===name));
    if(name==="chat") input.focus();
  }
  tabs.forEach(t=>t.addEventListener("click",()=>switchView(t.dataset.view)));
  document.getElementById("openChat").addEventListener("click",()=>switchView("chat"));

  function addMessage(text,role){
    const el=document.createElement("div");
    el.className="msg "+role;
    el.textContent=text;
    messages.appendChild(el);
    messages.scrollTop=messages.scrollHeight;
    return el;
  }

  async function sendMessage(){
    const text=input.value.trim();
    if(!text||send.disabled)return;
    input.value="";
    input.style.height="42px";
    addMessage(text,"user");
    history.push({role:"user",content:text});
    send.disabled=true;
    statusEl.textContent="● JARVIS думает…";
    const thinking=addMessage("Обрабатываю запрос…","system");
    try{
      if(API_URL.includes("YOUR-BACKEND-DOMAIN")){
        throw new Error("Backend ещё не подключён. Нужно развернуть сервер и указать его URL в index.html.");
      }
      const response=await fetch(API_URL,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:history})
      });
      if(!response.ok) throw new Error("Ошибка сервера: "+response.status);
      const data=await response.json();
      const answer=data.reply||data.message||data.content;
      if(!answer)throw new Error("Сервер вернул пустой ответ.");
      thinking.remove();
      addMessage(answer,"jarvis");
      history.push({role:"assistant",content:answer});
      statusEl.textContent="● JARVIS готов";
    }catch(err){
      thinking.remove();
      addMessage("Не удалось получить ответ: "+err.message,"system");
      statusEl.textContent="● Нет соединения";
    }finally{send.disabled=false;input.focus();}
  }
  send.addEventListener("click",sendMessage);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}});
  input.addEventListener("input",()=>{input.style.height="42px";input.style.height=Math.min(input.scrollHeight,140)+"px";});
</script>
</body>
</html>
